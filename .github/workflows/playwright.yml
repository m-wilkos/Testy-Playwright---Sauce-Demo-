name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Pobierz kod repozytorium
      uses: actions/checkout@v4

    - name: Skonfiguruj środowisko Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Zainstaluj zależności projektu (npm install)
      run: npm ci

    - name: Zainstaluj przeglądarki Playwright
      run: npx playwright install --with-deps

    - name: Uruchom testy automatyczne
      run: npx playwright test

    - name: Zapisz raport HTML z testów
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-raport
        path: playwright-report/
        retention-days: 7